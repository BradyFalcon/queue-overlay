<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fortnite Queue Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; font-family: Arial, sans-serif; }

  .overlay { padding: 12px; width: 280px; }

  .panel-header {
    background: #1a6fb5;
    border: 2px solid #5bc8f5;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title {
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .panel-count {
    margin-left: auto;
    background: #5bc8f5;
    color: #042C53;
    font-size: 12px;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .panel-body {
    background: rgba(4, 44, 83, 0.92);
    border: 2px solid #5bc8f5;
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 8px;
    min-height: 60px;
  }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 6px;
    margin-bottom: 5px;
    background: rgba(91, 200, 245, 0.08);
    border: 1px solid rgba(91, 200, 245, 0.25);
  }
  .queue-item:last-child { margin-bottom: 0; }
  .queue-item.first {
    background: rgba(91, 200, 245, 0.2);
    border-color: #5bc8f5;
  }
  .position {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #1a6fb5;
    border: 1.5px solid #5bc8f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: #5bc8f5;
    flex-shrink: 0;
  }
  .queue-item.first .position {
    background: #5bc8f5;
    color: #042C53;
    border-color: #fff;
  }
  .username {
    font-size: 14px;
    font-weight: bold;
    color: #e8f7ff;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .queue-item.first .username { color: #fff; }
  .crown { font-size: 14px; color: #f5c842; }
  .empty-msg {
    text-align: center;
    color: rgba(91, 200, 245, 0.5);
    font-size: 13px;
    padding: 14px 0;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 2px 0;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f87171;
    flex-shrink: 0;
  }
  .status-dot.connected { background: #4ade80; }
  .status-text {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<div class="overlay">
  <div class="panel-header">
    <span style="font-size:16px;">&#128101;</span>
    <span class="panel-title">Queue</span>
    <span class="panel-count" id="count">0 players</span>
  </div>
  <div class="panel-body" id="queue-list">
    <div class="empty-msg">Queue is empty</div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Connecting...</span>
  </div>
</div>

<script>
  var WS_HOST = "127.0.0.1";
  var WS_PORT = 8080;

  var queue = [];
  var ws;
  var reconnectTimer;

  function render() {
    var el = document.getElementById('queue-list');
    var count = document.getElementById('count');
    count.textContent = queue.length + (queue.length === 1 ? ' player' : ' players');
    if (queue.length === 0) {
      el.innerHTML = '<div class="empty-msg">Queue is empty</div>';
      return;
    }
    el.innerHTML = queue.slice(0, 8).map(function(user, i) {
      return '<div class="queue-item ' + (i === 0 ? 'first' : '') + '">' +
        '<div class="position">' + (i + 1) + '</div>' +
        '<span class="username">' + escapeHtml(user) + '</span>' +
        (i === 0 ? '<span class="crown">&#9733;</span>' : '') +
        '</div>';
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setStatus(connected) {
    var dot = document.getElementById('status-dot');
    var text = document.getElementById('status-text');
    if (connected) {
      dot.classList.add('connected');
      text.textContent = 'Connected to Streamer.bot';
    } else {
      dot.classList.remove('connected');
      text.textContent = 'Disconnected - retrying...';
    }
  }

  function connect() {
    try {
      ws = new WebSocket("ws://" + WS_HOST + ":" + WS_PORT + "/");
    } catch(e) {
      setStatus(false);
      reconnectTimer = setTimeout(connect, 3000);
      return;
    }

    ws.onopen = function() {
      setStatus(true);
      console.log("Connected to Streamer.bot WebSocket");
    };

    ws.onmessage = function(evt) {
      try {
        var data = JSON.parse(evt.data);
        console.log("Message received:", JSON.stringify(data));

        if (data.type === "queueUpdate" && Array.isArray(data.queue)) {
          queue = data.queue;
          render();
        }
      } catch(e) {
        console.log("Parse error:", e);
      }
    };

    ws.onclose = function() {
      setStatus(false);
      console.log("Disconnected, retrying in 3s...");
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = function(e) {
      console.log("WebSocket error:", e);
      ws.close();
    };
  }

  render();
  connect();
</script>
</body>
</html>
